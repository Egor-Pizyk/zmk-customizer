version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    labels:
      - 'release:patch'
    # Keep coupled toolchains together; review major upgrades separately.
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
        update-types: [minor, patch]
      vitest:
        patterns: ['vitest', '@vitest/*']
        update-types: [minor, patch]
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    labels:
      - 'release:patch'
