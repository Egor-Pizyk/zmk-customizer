name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f infra/Dockerfile --target prod -t zmk-customizer .

  mutations:
    env:
      APP_USER: root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: make install
      - run: make test-mutations

  zmk-build:
    env:
      APP_USER: root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: .zmk-build/workspace
          key: zmk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/zmk-build.env', 'infra/zmk-build.sh', 'infra/zmk-west.yml', 'infra/compose.zmk.yaml') }}
      - run: make install && make zmk-build
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: zmk-build-evidence
          path: |
            .zmk-build/logs
            .zmk-build/artifacts
            .zmk-build/exports
