name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f infra/Dockerfile --target prod -t zmk-customizer .

  mutations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: make install
      - run: make test-mutations

  zmk-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine relevant inputs
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          base = os.environ.get('BASE', '')
          relevant = True
          if base and set(base) != {'0'}:
              result = subprocess.run(['git', 'diff', '--name-only', base, 'HEAD'], capture_output=True, text=True)
              if result.returncode == 0:
                  roots = ('src/', 'tests/', 'scripts/', 'infra/', 'specs/023-', 'docs/zmk/', '.github/workflows/')
                  files = {'Makefile', 'package.json', 'package-lock.json', 'vite.config.ts', 'tsconfig.json'}
                  relevant = any(p.startswith(roots) or p in files for p in result.stdout.splitlines())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'relevant={str(relevant).lower()}\n')
          PY
      - uses: actions/cache@v5
        if: steps.changes.outputs.relevant == 'true'
        with:
          path: .zmk-build/workspace
          key: zmk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infra/zmk-build.env', 'infra/zmk-build.sh', 'infra/zmk-west.yml', 'infra/compose.zmk.yaml') }}
      - run: make install && make zmk-build
        if: steps.changes.outputs.relevant == 'true'
      - uses: actions/upload-artifact@v6
        if: always() && steps.changes.outputs.relevant == 'true'
        with:
          name: zmk-build-evidence
          path: |
            .zmk-build/logs
            .zmk-build/artifacts
            .zmk-build/exports
      - name: Complete build status for irrelevant changes
        if: steps.changes.outputs.relevant != 'true'
        run: echo 'No firmware inputs changed; zmk-build status completed.'
