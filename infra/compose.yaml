services:
  app:
    user: ${APP_USER:-node}
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: dev
    ports:
      - '5173:5173'
    volumes:
      - ..:/app
      - node_modules:/app/node_modules

  prod:
    profiles: [prod]
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: prod
      args:
        VITE_GITHUB_AUTH_URL: ${VITE_GITHUB_AUTH_URL:-}
        VITE_GITHUB_APP_SLUG: ${VITE_GITHUB_APP_SLUG:-}
    environment:
      ZMK_CONNECT_SOURCES: "${ZMK_CONNECT_SOURCES:-'none'}"
    ports:
      - '8080:80'

volumes:
  node_modules:
